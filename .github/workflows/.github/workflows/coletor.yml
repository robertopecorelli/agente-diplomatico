name: Executar Coletor Diplomático

on:
  schedule:
    # Executa todos os dias às 06:00 (horário de Brasília / 09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite disparar manualmente pela aba Actions do GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser psycopg2-binary beautifulsoup4

      - name: Executar robô
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python coletor.py
