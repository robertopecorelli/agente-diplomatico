name: Agente Diplomático Diário

on:
  schedule:
    # Roda todos os dias às 08:00 UTC (ajuste o horário conforme sua preferência)
    - cron: '0 8 * * *'
  
  # Permite que você execute o script manualmente a qualquer momento pelo site do GitHub
  workflow_dispatch:

jobs:
  executar-agente:
    runs-on: ubuntu-latest
    
    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências (bibliotecas)
      run: |
        python -m pip install --upgrade pip
        pip install feedparser requests

    - name: Executar o Agente Python
      run: python main.py

