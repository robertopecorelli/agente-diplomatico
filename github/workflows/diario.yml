name: Agente Diplomático Diário

on:
  schedule:
    - cron: '0 8 * * *' # Roda todo dia às 08:00 UTC
  workflow_dispatch:

jobs:
  executar-agente:
    runs-on: ubuntu-latest
    
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install feedparser requests resend

    - name: Executar o Agente Python
      run: python main.py
